services:
  # PostgreSQL - Local video database
  postgres:
    image: postgres:16-alpine
    container_name: deep-searching-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: deep_searching
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js App
  nextjs:
    build:
      context: ./nextjs-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: deep-searching
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Supabase (Auth, History, Channel Sources)
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_CRON_TOKEN: ${ADMIN_CRON_TOKEN:?Set ADMIN_CRON_TOKEN in .env}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:?Set YOUTUBE_API_KEY in .env}
      # Ollama runs on the host machine; containers must use host.docker.internal instead of localhost.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      COOKIES_FILE: ${COOKIES_FILE:-/app/data/cookies.txt}
      COOKIES_FILE_2: ${COOKIES_FILE_2:-/app/data/cookies2.txt}
      DAILY_CHANNEL_SYNC_CONCURRENCY: ${DAILY_CHANNEL_SYNC_CONCURRENCY:-4}
      DB_ANALYSIS_MAX_WORKERS: ${DB_ANALYSIS_MAX_WORKERS:-1}
      DB_ANALYSIS_MIN_DELAY_SECONDS: ${DB_ANALYSIS_MIN_DELAY_SECONDS:-0}
      DB_ANALYSIS_MAX_DELAY_SECONDS: ${DB_ANALYSIS_MAX_DELAY_SECONDS:-0}
      # Cloudflare R2 backup
      R2_BACKUP_ENABLED: ${R2_BACKUP_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BACKUP_PREFIX: ${R2_BACKUP_PREFIX:-backups}
      R2_BACKUP_OBJECT_NAME: ${R2_BACKUP_OBJECT_NAME:-latest.jsonl}
      # Local PostgreSQL (Video Data)
      LOCAL_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_APP_DB:-deep_searching}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-credentials.json
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nextjs-app/data:/app/data
      - ${GOOGLE_CREDENTIALS_HOST_PATH:?Set GOOGLE_CREDENTIALS_HOST_PATH in .env}:/run/secrets/google-credentials.json:ro

  # Cloudflare Tunnel - Expose local app to the internet
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: deep-searching-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nextjs

  daily-update-cron:
    build:
      context: ./docker/daily-update-cron
    container_name: deep-searching-daily-cron
    restart: unless-stopped
    environment:
      TZ: Asia/Bangkok
      UPDATE_URL: http://nextjs:3000/api/admin/daily-update/cron
      ADMIN_CRON_TOKEN: ${ADMIN_CRON_TOKEN:?Set ADMIN_CRON_TOKEN in .env}
    depends_on:
      - nextjs
      
  pgadmin:
    image: dpage/pgadmin4
    container_name: deep-searching-pgadmin
    restart: unless-stopped
    profiles:
      - admin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
